name: Fetch Nodes

"on":
  push:
    tags:
      - '*'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: fetch-nodes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 收紧测活后仍可能要几分钟；给足时间
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      # 比“端口开着就算活”更严：短超时 + 低延迟阈值
      TCP_CONCURRENCY: "500"
      TCP_TIMEOUT: "3.5"
      LATENCY_MAX_MS: "2500"
      MAX_OUTPUT_NODES: "2500"
      FETCH_WORKERS: "16"
      FETCH_TIMEOUT: "20"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download GeoIP DB
        run: wget -qO GeoLite2-Country.mmdb "https://github.com/Loyalsoldier/geoip/releases/latest/download/Country.mmdb"

      - name: Fetch nodes
        run: python -u fetch.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || (git commit -m "update $(date -u '+%Y-%m-%d %H:%M') UTC" && git pull --rebase origin ${{ github.event.repository.default_branch }} && git push origin HEAD:${{ github.event.repository.default_branch }})
