# 节点聚合源配置
# 策略：少而精。优先「已测活/体量适中」的源，砍掉超大垃圾聚合池。
# blue2sea 公共 Clash 订阅 token 每日轮换，由 fetch.py 从 FreeProxies README 自动解析。
# 2026-08-22 换血：清掉实测 raw=1 的废源（mahdibland/NoMoreWalls/Pawdroid/AutoMerge/freefq/
#   clashfree/v2rayfree/awesome-vpn/mfuu/shaoyouvip/wrfree/Surfboardv2ray），
#   提高 epoch 仍在出货的大源优先级与 limit（实测 daily_free_vpn/Mahdi0024/ALIILAPRO/
#   Epodonios/barry-far/MatinGhanbari/MhdiTaheri）。

sources:
  # --- 高质量/已过滤源（优先） ---
  # 2026-08-23 打野新增：0xRadikal/Free-v2ray-Configs（15min 自动更新，light 精选档全量）
  - name: "0xRadikal/Free-v2ray-Configs"
    url: "https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/light/configs_base64.txt"
    limit: 3000
    priority: 95

  # 2026-08-23 exa 打野新增：sing-box 真 HTTP 204 验证活跃节点，每小时刷新（全量）
  - name: "Au1rxx/free-vpn-subscriptions"
    url: "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/v2ray-base64.txt"
    limit: 2000
    priority: 92

  # 2026-08-23 exa 打野新增：ebrasha 巨量池（vless 3.5万 + vmess 6千，15min 更新）
  # 2026-08-23 增大 limit：多进 L3 测活窗口，能过测活的才进池
  - name: "ebrasha/free-v2ray-public-list-vless"
    url: "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/vless_configs.txt"
    limit: 8000
    priority: 85

  - name: "ebrasha/free-v2ray-public-list-vmess"
