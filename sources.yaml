# 节点聚合源配置
# 策略：少而精。优先「已测活/体量适中」的源，砍掉超大垃圾聚合池。
# blue2sea 公共 Clash 订阅 token 每日轮换，由 fetch.py 从 FreeProxies README 自动解析。

sources:
  # --- 高质量/已过滤源（优先） ---
  - name: "blue2sea/public"
    # 入口页会 429/空壳；真正节点在 proxy-providers 嵌套 URL
    # token 由 fetch.py 动态解析；此 url 作 fallback
    url: "https://blue2sea.com/clash/2143c2ec19da075e495552259ad4bade"
    dynamic: blue2sea
    headers:
      User-Agent: "ClashforWindows/0.20.39"
    resolve_providers: true
    priority: 100

  - name: "mahdibland/V2RayAggregator"
    url: "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/Eternity"
    priority: 90

  - name: "mahdibland/V2RayAggregatorAir"
    url: "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/EternityAir"
    priority: 90

  - name: "peasoft/NoMoreWalls"
    url: "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.txt"
    priority: 85

  - name: "Pawdroid/Free-servers"
    url: "https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub"
    priority: 80

  - name: "ermaozi/get_subscribe"
    url: "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/v2ray.txt"
    priority: 80

  - name: "chengaopan/AutoMergePublicNodes"
    url: "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt"
    priority: 75

  - name: "freefq/free"
    url: "https://raw.githubusercontent.com/freefq/free/master/v2"
    priority: 70

  - name: "free-nodes/clashfree"
    url_template: "https://raw.githubusercontent.com/free-nodes/clashfree/main/clash{date}.yml"
    date_format: "%Y%m%d"
    resolve_providers: true
    priority: 70

  # --- 2026-08-19 新增源（easy 池健康节点下滑，补量） ---
  - name: "free-nodes/v2rayfree"
    url: "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub"
    priority: 75

  - name: "cbusifabcap/daily_free_vpn"
    url: "https://raw.githubusercontent.com/cbusifabcap/daily_free_vpn/main/Z.txt"
    priority: 65

  # --- 中等体量源 ---
  - name: "Barabama/yudou66"
    url: "https://raw.githubusercontent.com/Barabama/FreeNodes/main/nodes/yudou66.txt"
    priority: 60

  - name: "Barabama/nodefree"
